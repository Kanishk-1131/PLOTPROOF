name: PlotProof Enterprise CI/CD Pipeline

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-tests:
    name: Backend Regression & Forensic Layers (L1-L10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (GDAL, GEOS, Poppler)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin libgeos-dev poppler-utils tesseract-ocr tesseract-ocr-tam

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Full Multi-Layer Regression Suite
        run: |
          python -m unittest discover -s backend/tests -p "test_*.py" -v

  smart-contract-tests:
    name: Polygon Smart Contract & ZK Key Validation (L7-L8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: blockchain/package.json

      - name: Install Blockchain Dependencies
        working-directory: ./blockchain
        run: npm ci

      - name: Run Hardhat Contract Tests
        working-directory: ./blockchain
        run: npx hardhat test

  frontend-build:
    name: Next.js Frontend Production Build (L9-L10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Next.js Production App
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build
